<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="intern-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#intern-bg)" />

  <g transform="translate(150, 70)">
    <!-- Student / Developer Desk Card -->
    <rect width="500" height="310" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

    <!-- Graduation Cap / Growth Badge -->
    <circle cx="250" cy="80" r="45" fill="#4f46e5" />
    <text x="250" y="93" font-size="36" text-anchor="middle">🎓</text>

    <!-- Title & Tagline -->
    <text x="250" y="160" font-family="'Outfit', sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">Internship Roadmap</text>
    <text x="250" y="190" font-family="'Outfit', sans-serif" font-size="15" fill="#a5b4fc" text-anchor="middle">From 2nd-Year Foundations to Remote Offers</text>

    <!-- Checklist items -->
    <g transform="translate(90, 220)" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e2e8f0">
      <text x="0" y="0">✓ Build 3 End-to-End Projects (Web, Java DSA, IoT)</text>
      <text x="0" y="30">✓ Active GitHub Repositories with Clean READMEs</text>
      <text x="0" y="60">✓ Meaningful LinkedIn Outreach &amp; Networking</text>
    </g>
  </g>
</svg>
