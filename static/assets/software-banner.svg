<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="soft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="soft-code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#soft-bg)" />
  <!-- IDE Window Frame -->
  <g transform="translate(100, 60)">
    <rect width="600" height="330" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <!-- Title bar -->
    <rect width="600" height="42" rx="16" fill="#1e293b" />
    <circle cx="30" cy="21" r="6" fill="#ef4444" />
    <circle cx="50" cy="21" r="6" fill="#f59e0b" />
    <circle cx="70" cy="21" r="6" fill="#10b981" />
    <text x="300" y="26" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94a3b8" text-anchor="middle">Main.java — Algorithm &amp; Architecture</text>

    <!-- Code Editor Content -->
    <g transform="translate(30, 70)" font-family="'JetBrains Mono', monospace" font-size="15">
      <text x="0" y="20" fill="#f43f5e">public class <tspan fill="#67e8f9">BinarySearchTree</tspan>&lt;<tspan fill="#fcd34d">T</tspan>&gt; {</text>
      <text x="24" y="55" fill="#f43f5e">    private <tspan fill="#cbd5e1">Node&lt;T&gt; root;</tspan></text>
      <text x="24" y="90" fill="#f43f5e">    public void <tspan fill="#60a5fa">insert</tspan>(<tspan fill="#fcd34d">T</tspan> <tspan fill="#cbd5e1">data) {</tspan></text>
      <text x="48" y="125" fill="#cbd5e1">        root = <tspan fill="#60a5fa">insertRec</tspan>(root, data); <tspan fill="#64748b">// O(log N)</tspan></text>
      <text x="24" y="160" fill="#cbd5e1">    }</text>
      <text x="24" y="195" fill="#10b981">    // System architecture ready for production</text>
      <text x="0" y="230" fill="#f43f5e">}</text>
    </g>
  </g>
</svg>
